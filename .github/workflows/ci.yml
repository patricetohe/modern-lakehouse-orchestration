name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # Scoped to what the current unit tests need (tests/test_project_skeleton.py
      # only needs PyYAML, no dbt/Airflow/Great Expectations install), not the
      # full requirements.txt — keeps CI fast and reliable. This covers the
      # "run unit tests" slice; the full `dbt build` + GE validation CI is a
      # separate, later roadmap item.
      - name: Install test dependencies
        run: pip install pytest pyyaml

      - name: Run unit tests
        run: pytest -q
